name: 정기 브리핑

on:
  schedule:
    # 크론은 UTC. KST = UTC + 9. 07:30 KST는 UTC로 전날이라 요일이 하나 밀린다.
    - cron: "30 22 * * 0-4"   # 07:30 KST 월~금
    - cron: "0 7 * * 1-5"     # 16:00 KST 월~금
    - cron: "0 12 * * 1-5"    # 21:00 KST 월~금
  workflow_dispatch:
    inputs:
      slot:
        description: 슬롯
        type: choice
        options: [morning, close, evening]
        default: close

concurrency:
  group: repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 브리핑 생성
        env:
          SLOT: ${{ inputs.slot }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m src.main

      - name: 페이지 배포
        run: bash scripts/push.sh "brief"

      - name: Pages 반영 대기
        run: sleep 45

      - name: 카카오톡 발송
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python -m src.notify
