name: 조건 알림

on:
  schedule:
    # 국내장 09:00~15:30 KST = 00:00~06:30 UTC
    # 국내 수급 확정치 확인 = 07:00~11:00 UTC
    # 미국장 22:30~05:00 KST = 13:30~20:00 UTC
    - cron: "*/15 0-6 * * 1-5"
    - cron: "0 8,10 * * 1-5"
    - cron: "*/15 13-20 * * 1-5"
  workflow_dispatch:

concurrency:
  group: repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 조건 확인
        run: python -m src.watch

      - name: 알림 기록 저장
        run: bash scripts/push.sh "alert state"

      - name: 카카오톡 발송
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python -m src.notify
