name: 종목 관리

on:
  workflow_dispatch:
    inputs:
      action:
        description: 무엇을 할까요
        type: choice
        options: [추가, 삭제, 목록보기]
        required: true
        default: 추가
      code:
        description: 종목코드 (국내 6자리 또는 미국 티커). 목록보기는 비워두세요
        required: false
      avg_price:
        description: 평균 매수단가 (선택)
        required: false
      stop_loss:
        description: 손절 기준 % (선택, 예 -7)
        required: false
      take_profit:
        description: 목표 수익률 % (선택, 예 15)
        required: false

concurrency:
  group: repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 실행
        run: |
          set -e
          case "${{ inputs.action }}" in
            추가)
              ARGS="add ${{ inputs.code }}"
              [ -n "${{ inputs.avg_price }}" ]  && ARGS="$ARGS --avg ${{ inputs.avg_price }}"
              [ -n "${{ inputs.stop_loss }}" ]  && ARGS="$ARGS --stop ${{ inputs.stop_loss }}"
              [ -n "${{ inputs.take_profit }}" ] && ARGS="$ARGS --target ${{ inputs.take_profit }}"
              python -m src.manage $ARGS | tee result.txt
              ;;
            삭제)
              python -m src.manage remove "${{ inputs.code }}" | tee result.txt
              ;;
            목록보기)
              python -m src.manage list | tee result.txt
              ;;
          esac

      - name: 결과 요약
        run: |
          echo '### 종목 관리 결과' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat result.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 저장
        if: inputs.action != '목록보기'
        run: |
          rm -f result.txt
          bash scripts/push.sh "watchlist ${{ inputs.action }} ${{ inputs.code }}"
